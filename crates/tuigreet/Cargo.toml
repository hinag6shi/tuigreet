[package]
name                   = "tuigreet"
description            = "Stylish graphical console greeter for greetd, built with Ratatui"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
repository             = "https://github.com/notashelf/tuigreet"

[[bin]]
name = "tuigreet"
path = "src/main.rs"

[features]
default    = [  ]
nsswrapper = [  ]

[dependencies]
tuigreet-config  = { workspace = true }
tuigreet-locales = { workspace = true }
tuigreet-system  = { workspace = true }
tuigreet-theme   = { workspace = true }
tuigreet-types   = { workspace = true }

ansi-to-tui        = { workspace = true }
chrono             = { workspace = true }
crossterm          = { workspace = true }
dirs.workspace = true
futures            = { workspace = true }
getopts            = { workspace = true }
greetd_ipc         = { workspace = true }
i18n-embed         = { workspace = true }
nix                = { workspace = true }
notify             = { workspace = true }
rand               = { workspace = true }
rust-ini           = { workspace = true }
tokio              = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-appender   = { workspace = true }
tracing-subscriber = { workspace = true }
tui                = { workspace = true }
utmp-rs            = { workspace = true }
uzers              = { workspace = true }
zeroize            = { workspace = true }

image   = { version = "0.25.10", default-features = false, features = ["gif"] }
sha2    = "0.11.0"
bincode = "1.3"
serde   = { workspace = true, features = ["derive"] }

[dev-dependencies]
greetd-stub   = { workspace = true }
tempfile      = { workspace = true }
unicode-width = { workspace = true }
